
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3EEE5">
  <title>نقاط المطبخ | العيلة</title>

  <style>
    :root {
      --bg: #F3EEE5;
      --surface: #FCFAF6;
      --surface2: #F5F0E8;
      --beige: #E8DFD0;
      --gold: #A58B5D;
      --gold-light: #D6C4A1;
      --ink: #514638;
      --muted: #968A78;
      --line: #E9E1D5;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI",
        Tahoma, Arial, sans-serif;
    }

    .wrap {
      max-width: 650px;
      margin: auto;
      padding: 20px 15px 45px;
    }

    header {
      background: linear-gradient(145deg, #E8DFD0, #DDD0BB);
      border: 1px solid #E2D7C7;
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    header:after {
      content: "✦";
      position: absolute;
      left: 20px;
      top: 8px;
      color: #B49A6B;
      font-size: 85px;
      opacity: .15;
    }

    .eyebrow {
      font-size: 13px;
      color: #8D7650;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 27px;
      margin: 0 0 7px;
      font-weight: 850;
      color: #514638;
    }

    .sub {
      margin: 0;
      color: #827665;
      font-size: 14px;
    }

    .chef {
      font-size: 43px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 19px;
      margin: 14px 0;
      box-shadow: 0 4px 16px #51463808;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 14px;
      color: var(--ink);
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      margin: -7px 0 14px;
      line-height: 1.7;
    }

    /* اختيار الأشخاص عمودياً */
    .people {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .person {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      min-height: 59px;
      transition: .2s;
    }

    .person input {
      accent-color: var(--gold);
      width: 19px;
      height: 19px;
      cursor: pointer;
    }

    .person.selected {
      border-color: var(--gold-light);
      background: #F5F0E8;
    }

    .person span {
      font-weight: 700;
      font-size: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 16px 0 8px;
    }

    input[type=text] {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      background: #FFFFFF;
      color: var(--ink);
      outline: none;
    }

    input[type=text]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px #A58B5D18;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 13px;
      background: var(--gold);
      color: #FFFFFF;
      font: inherit;
      font-weight: 800;
      padding: 15px;
      margin-top: 17px;
      cursor: pointer;
      transition: .2s;
    }

    .primary:hover {
      background: #92784D;
    }

    .primary:disabled {
      opacity: .55;
      cursor: wait;
    }

    .status {
      font-size: 13px;
      margin-top: 10px;
      color: var(--muted);
      min-height: 20px;
      line-height: 1.7;
    }

    /* ترتيب النقاط عمودياً */
    .scores {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .score {
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .scoretop {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .score-name {
      font-weight: 750;
      font-size: 16px;
    }

    .medal {
      color: var(--gold);
      font-size: 19px;
    }

    .points {
      font-size: 23px;
      font-weight: 850;
      color: var(--gold);
      white-space: nowrap;
    }

    .points small {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .entry {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .entry:last-child {
      border: 0;
    }

    .entry-title {
      font-weight: 750;
    }

    .entry-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.7;
    }

    .entry-points {
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 22px;
    }

    @media (max-width: 380px) {
      .wrap {
        padding: 14px 10px 35px;
      }

      header {
        padding: 20px;
      }

      h1 {
        font-size: 23px;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
<div class="wrap">

  <header>
    <div class="eyebrow">مطبخ العيلة ✦</div>

    <div class="hero">
      <div>
        <h1>مين اشتغل اليوم؟</h1>
        <p class="sub">كل مساعدة إلها نقاطها ✨</p>
      </div>
      <div class="chef">🍳</div>
    </div>
  </header>

  <section class="card">
    <h2>١. مين شارك بالمطبخ؟</h2>

    <p class="hint">
      بتقدر تختار شخص واحد أو أكثر، وكل شخص بياخد النقاط كاملة.
    </p>

    <div class="people" id="people">
      <label class="person">
        <input type="checkbox" value="عبدالله">
        <span>عبدالله</span>
      </label>

      <label class="person">
        <input type="checkbox" value="عماد">
        <span>عماد</span>
      </label>

      <label class="person">
        <input type="checkbox" value="لوسن">
        <span>لوسن</span>
      </label>

      <label class="person">
        <input type="checkbox" value="ماما">
        <span>ماما</span>
      </label>
    </div>

    <div style="
      margin-top:16px;
      padding:13px 14px;
      background:#F0E9DC;
      border:1px solid #E9DFCE;
      border-radius:12px;
      color:#806D4D;
      font-weight:700;
      font-size:14px;
    ">
      ✦ كل مشاركة بالمطبخ = نقطة واحدة لكل شخص
    </div>

    <label for="description">
      ٢. شو كان الشغل؟
      <span style="font-weight:400;color:#968A78">
        (اختياري)
      </span>
    </label>

    <input
      id="description"
      type="text"
      maxlength="100"
      placeholder="مثلاً: غسل الصحون، تحضير الغداء..."
    >

    <button class="primary" id="add">
      سجّل النقاط
    </button>

    <div class="status" id="status" role="status"></div>
  </section>

  <section class="card">
    <h2>🏆 ترتيب النقاط</h2>
    <div class="scores" id="scores">
      <div class="empty">عم نحمل النقاط...</div>
    </div>
  </section>

  <section class="card">
    <h2>📋 آخر المشاركات</h2>
    <div id="history">
      <div class="empty">عم نحمل السجل...</div>
    </div>
  </section>

  <footer>
    نقاط المطبخ · العيلة ✦
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://dplcxbzeoyzosbzizuur.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_z8znGTCHzSap-Y7HW-TX-w_o8kXcqe4";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const names = ["عبدالله", "عماد", "لوسن", "ماما"];

  const statusEl = document.getElementById("status");
  const addBtn = document.getElementById("add");

  // تحديد الأشخاص
  document.querySelectorAll(".person input").forEach(input => {
    input.addEventListener("change", () => {
      input.closest(".person")
        .classList.toggle("selected", input.checked);
    });
  });

  // حماية النصوص
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));
  }

  function dateText(value) {
    return new Date(value).toLocaleString("ar-AE", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }

  // تحديث النقاط والسجل
  async function refresh() {
    const { data, error } = await db
      .from("kitchen_points")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) {
      statusEl.textContent =
        "ما قدرنا نحمل البيانات: " + error.message;
      return;
    }

    const totals = Object.fromEntries(
      names.map(n => [n, 0])
    );

    data.forEach(row => {
      if (totals[row.person_name] !== undefined) {
        totals[row.person_name] += Number(row.points) || 0;
      }
    });

    // ترتيب تنازلي
    const sorted = [...names].sort(
      (a, b) => totals[b] - totals[a]
    );

    document.getElementById("scores").innerHTML =
      sorted.map((n, i) => `
        <div class="score">
          <div class="scoretop">
            <span class="medal">
              ${i === 0 && totals[n] > 0 ? "🏅" : ""}
            </span>
            <span class="score-name">
              ${escapeHtml(n)}
            </span>
          </div>

          <div class="points">
            ${totals[n]} <small>نقطة</small>
          </div>
        </div>
      `).join("");

    // عرض سجل المشاركات
    document.getElementById("history").innerHTML =
      data.length
        ? data.map(row => `
          <div class="entry">
            <div>
              <div class="entry-title">
                ${escapeHtml(row.person_name)}
              </div>

              <div class="entry-meta">
                ${escapeHtml(
                  row.work_description || "مشاركة بالمطبخ"
                )}
                · ${dateText(row.created_at)}
              </div>
            </div>

            <div class="entry-points">
              +${Number(row.points)} ✦
            </div>
          </div>
        `).join("")
        : '<div class="empty">لسه ما في نقاط مسجلة. خلينا نبدأ! ✦</div>';
  }

  // تسجيل النقاط
  addBtn.addEventListener("click", async () => {
    const selected = [
      ...document.querySelectorAll(".person input:checked")
    ].map(input => input.value);

    const points = 1;

    const description =
      document.getElementById("description").value.trim();

    if (!selected.length) {
      statusEl.textContent =
        "اختار شخص واحد على الأقل أولاً.";
      return;
    }

    addBtn.disabled = true;
    statusEl.textContent = "عم نسجل النقاط...";

    const rows = selected.map(person_name => ({
      person_name,
      points,
      work_description: description || null
    }));

    const { error } = await db
      .from("kitchen_points")
      .insert(rows);

    if (error) {
      statusEl.textContent =
        "صار خطأ أثناء التسجيل: " + error.message;
    } else {
      statusEl.textContent =
        `تم تسجيل نقطة لكل من: ${selected.join("، ")} ✦`;

      document.querySelectorAll(".person input").forEach(input => {
        input.checked = false;
        input.closest(".person").classList.remove("selected");
      });

      document.getElementById("description").value = "";

      await refresh();
    }

    addBtn.disabled = false;
  });

  // تحميل أولي وتحديث كل 10 ثوانٍ
  refresh();
  setInterval(refresh, 10000);

</script>

</body>
</html>
