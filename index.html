<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244b3c">
  <title>نقاط المطبخ | العيلة</title>
  <style>
    :root{--green:#244b3c;--green2:#376b55;--mint:#e8f1eb;--cream:#f7f8f4;--ink:#203329;--muted:#718078;--line:#e2e9e3;--white:#fff;--gold:#c18b35}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
    .wrap{max-width:760px;margin:auto;padding:24px 16px 48px}
    header{background:linear-gradient(135deg,#244b3c,#47785e);color:white;border-radius:24px;padding:24px;margin-bottom:18px;position:relative;overflow:hidden}
    header:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #ffffff30;border-radius:50%;left:-40px;top:-70px}
    .eyebrow{font-size:13px;opacity:.8;margin-bottom:8px}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:27px;margin:0 0 7px;font-weight:800}.sub{margin:0;color:#e2eee6;font-size:14px}.chef{font-size:42px}
    .card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #20332908}
    h2{font-size:18px;margin:0 0 14px}.hint{font-size:13px;color:var(--muted);margin:-7px 0 14px}
    .people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .person{border:1.5px solid var(--line);border-radius:15px;padding:13px;background:#fff;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s;min-height:58px}
    .person input{accent-color:var(--green2);width:18px;height:18px}.person.selected{border-color:var(--green2);background:var(--mint)}
    .person span{font-weight:700}
    label{display:block;font-size:14px;font-weight:700;margin:14px 0 7px}
    input[type=number],input[type=text]{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink);outline:none}
    input:focus{border-color:var(--green2);box-shadow:0 0 0 3px #376b5518}
    .primary{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;font:inherit;font-weight:800;padding:14px;margin-top:16px;cursor:pointer}
    .primary:disabled{opacity:.55;cursor:wait}
    .status{font-size:13px;margin-top:10px;color:var(--muted);min-height:20px}
    .scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .score{background:#f8faf7;border:1px solid var(--line);border-radius:15px;padding:14px}
    .scoretop{display:flex;justify-content:space-between;align-items:center;gap:8px}.score-name{font-weight:750}.medal{color:var(--gold)}
    .points{font-size:25px;font-weight:850;color:var(--green);margin-top:5px}.points small{font-size:12px;font-weight:600;color:var(--muted)}
    .entry{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
    .entry:last-child{border:0}.entry-title{font-weight:700}.entry-meta{font-size:12px;color:var(--muted);margin-top:4px}.entry-points{font-weight:800;color:var(--green);white-space:nowrap}
    .empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 0}
    footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
    @media(min-width:600px){.people,.scores{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">مطبخ العيلة</div>
    <div class="hero"><div><h1>مين اشتغل اليوم؟</h1><p class="sub">كل مساعدة إلها نقاطها ✨</p></div><div class="chef">🍳</div></div>
  </header>

  <section class="card">
    <h2>١. مين شارك بالمطبخ؟</h2>
    <p class="hint">بتقدر تختار شخص واحد أو أكثر، وكل شخص بياخد النقاط كاملة.</p>
    <div class="people" id="people">
      <label class="person"><input type="checkbox" value="عبدالله"><span>عبدالله</span></label>
      <label class="person"><input type="checkbox" value="عماد"><span>عماد</span></label>
      <label class="person"><input type="checkbox" value="لوسن"><span>لوسن</span></label>
      <label class="person"><input type="checkbox" value="ماما"><span>ماما</span></label>
    </div>
    <div style="margin-top:16px;padding:12px 14px;background:#e8f1eb;border-radius:12px;color:#244b3c;font-weight:700;font-size:14px">⭐ كل مشاركة بالمطبخ = نقطة واحدة لكل شخص</div>
    <label for="description">٢. شو كان الشغل؟ <span style="font-weight:400;color:#718078">(اختياري)</span></label>
    <input id="description" type="text" maxlength="100" placeholder="مثلاً: غسل الصحون، تحضير الغداء...">
    <button class="primary" id="add">سجّل النقاط</button>
    <div class="status" id="status" role="status"></div>
  </section>

  <section class="card">
    <h2>🏆 ترتيب النقاط</h2>
    <div class="scores" id="scores"><div class="empty">عم نحمل النقاط...</div></div>
  </section>

  <section class="card">
    <h2>📋 آخر المشاركات</h2>
    <div id="history"><div class="empty">عم نحمل السجل...</div></div>
  </section>
  <footer>نقاط المطبخ · العيلة ❤️</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://dplcxbzeoyzosbzizuur.supabase.co";
  const SUPABASE_KEY = "sb_publishable_z8znGTCHzSap-Y7HW-TX-w_o8kXcqe4";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const names = ["عبدالله","عماد","لوسن","ماما"];
  const statusEl = document.getElementById("status");
  const addBtn = document.getElementById("add");

  document.querySelectorAll(".person input").forEach(input=>{
    input.addEventListener("change",()=>input.closest(".person").classList.toggle("selected",input.checked));
  });

  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function dateText(value){
    return new Date(value).toLocaleString("ar-AE",{dateStyle:"medium",timeStyle:"short"});
  }
  async function refresh(){
    const {data,error}=await db.from("kitchen_points").select("*").order("created_at",{ascending:false}).limit(100);
    if(error){statusEl.textContent="ما قدرنا نحمل البيانات: "+error.message;return;}
    const totals=Object.fromEntries(names.map(n=>[n,0]));
    data.forEach(row=>{if(totals[row.person_name]!==undefined) totals[row.person_name]+=Number(row.points)||0;});
    const sorted=[...names].sort((a,b)=>totals[b]-totals[a]);
    document.getElementById("scores").innerHTML=sorted.map((n,i)=>`
      <div class="score"><div class="scoretop"><span class="score-name">${n}</span><span class="medal">${i===0 && totals[n]>0?"🏅":""}</span></div>
      <div class="points">${totals[n]} <small>نقطة</small></div></div>`).join("");
    document.getElementById("history").innerHTML=data.length?data.map(row=>`
      <div class="entry"><div><div class="entry-title">${escapeHtml(row.person_name)}</div>
      <div class="entry-meta">${escapeHtml(row.work_description||"مشاركة بالمطبخ")} · ${dateText(row.created_at)}</div></div>
      <div class="entry-points">+${Number(row.points)} ⭐</div></div>`).join(""):'<div class="empty">لسه ما في نقاط مسجلة. خلينا نبدأ! 🌱</div>';
  }

  addBtn.addEventListener("click",async()=>{
    const selected=[...document.querySelectorAll(".person input:checked")].map(x=>x.value);
    const points=1;
    const description=document.getElementById("description").value.trim();
    if(!selected.length){statusEl.textContent="اختار شخص واحد على الأقل أولاً.";return;}
    addBtn.disabled=true;statusEl.textContent="عم نسجل النقاط...";
    const rows=selected.map(person_name=>({person_name,points,work_description:description||null}));
    const {error}=await db.from("kitchen_points").insert(rows);
    if(error){statusEl.textContent="صار خطأ أثناء التسجيل: "+error.message;}
    else{
      statusEl.textContent=`تم تسجيل ${points} نقطة لكل من: ${selected.join("، ")} 🎉`;
      document.querySelectorAll(".person input").forEach(x=>{x.checked=false;x.closest(".person").classList.remove("selected");});
      document.getElementById("description").value="";
      await refresh();
    }
    addBtn.disabled=false;
  });
  refresh();
  setInterval(refresh,10000);
</script>
</body>
</html>
